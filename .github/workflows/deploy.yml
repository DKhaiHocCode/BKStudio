# Release images (T-045): pushing a tag vX.Y.Z that points at a commit on main builds backend, frontend and backup and
# pushes them to GHCR as ghcr.io/dkhaihoccode/bkstudio-<name>:<tag> and :sha-<commit>. It never deploys: run
# infra/deploy.sh <tag> on the VPS afterwards (docs/DEPLOYMENT.md "Deploy và rollback").
name: Release images

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + origin/main for the ancestry check
          persist-credentials: false
      - name: Tag format and commit on main
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z (infra/deploy.sh accepts only that)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1; }
      - name: Frontend build variables set
        run: |
          rc=0
          [[ "$SITE_URL" =~ ^https://[a-z0-9.-]+$ ]] \
            || { echo "::error::repository variable NEXT_PUBLIC_SITE_URL must be https://<host> with no path (Settings > Secrets and variables > Actions > Variables)"; rc=1; }
          [[ "$TURNSTILE_SITE_KEY" =~ ^[A-Za-z0-9_-]+$ ]] \
            || { echo "::error::repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is blank or has invalid characters"; rc=1; }
          exit "$rc"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
            # Public values, baked into the JS bundle at build time (docs/DEPLOYMENT.md section 2).
            build-args: |
              NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
              NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          - name: backup
            context: infra/backup
    env:
      IMAGE: ghcr.io/dkhaihoccode/bkstudio-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: true
          platforms: linux/amd64 # the VPS must be x86_64 (docs/DEPLOYMENT.md section 6b)
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Digest in job summary
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "\`$IMAGE:$TAG\` digest \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
