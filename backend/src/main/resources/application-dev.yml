# Local development overrides.
logging:
  structured:
    format:
      console: "" # empty -> plain text logs, easier to read while developing
spring:
  datasource:
    # Matches .env.example / infra/docker-compose.dev.yml. No password default: POSTGRES_PASSWORD must be set.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:bkstudio}
    username: ${POSTGRES_USER:bkstudio}
    password: ${POSTGRES_PASSWORD}
app:
  storage:
    # MinIO root credentials from .env; no secret default (same rule as POSTGRES_PASSWORD).
    access-key: ${MINIO_ROOT_USER:bkstudio}
    secret-key: ${MINIO_ROOT_PASSWORD}
