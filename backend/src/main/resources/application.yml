spring:
  application:
    name: bkstudio-backend
  flyway:
    enabled: true # schema is owned by db/migration; JPA (T-010) must use ddl-auto=validate or none

# Health lives at /api/health (same /api base path as the rest of the API).
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs # one JSON object per line; MDC keys (requestId) become top-level fields
