server:
  servlet:
    session:
      tracking-modes: cookie
      timeout: 30m # inactivity; the absolute 12 h limit is AbsoluteSessionTimeoutFilter
      cookie:
        http-only: true
        same-site: lax
        secure: true # only application-dev.yml turns this off (plain http://localhost)

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: bkstudio-backend
  flyway:
    enabled: true # schema is owned by db/migration; JPA must use ddl-auto=validate or none
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  catalog:
    # Public base of the image bucket/CDN (R2 in prod, MinIO locally); keys are appended by CatalogProperties.
    image-base-url: ${R2_PUBLIC_BASE_URL:http://localhost:9000/bkstudio-dev}
    ships-within-days: 7
  checkout:
    # Base of the customer order link (no secret). Prod fails startup unless it starts with https://.
    site-base-url: ${APP_BASE_URL:http://localhost:3000}
    rate-limit-max: 5 # orders per IP per window
    rate-limit-window: 1h
  notification:
    # Sender address (MAIL_FROM) and Resend key (RESEND_API_KEY, secret). Blank key = emails only logged (dev/test).
    # Prod fails startup unless both are set.
    mail-from: ${MAIL_FROM:}
    resend-api-key: ${RESEND_API_KEY:}
    outbox:
      enabled: true # scheduled sender; tests set false and call OutboxSender.runOnce()
  admin:
    # base64 of 32 random bytes, env only, no default. Required in prod (fails startup); elsewhere only when used.
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
  storage:
    # S3-compatible store: MinIO locally, Cloudflare R2 in prod (R2_ENDPOINT = https://<account>.r2.cloudflarestorage.com).
    # Credentials have no secret default here; dev profile maps them from MINIO_*, prod sets R2_* env vars.
    endpoint: ${R2_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
    region: ${R2_REGION:auto}
    bucket: ${R2_BUCKET:bkstudio-dev}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    path-style: true

# Health lives at /api/health (same /api base path as the rest of the API).
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs # one JSON object per line; MDC keys (requestId) become top-level fields
