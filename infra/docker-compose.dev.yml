# Local development services. Usage (from repo root):
#   cp .env.example .env
#   docker compose --env-file .env -f infra/docker-compose.dev.yml up -d
name: bkstudio-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO's Docker Hub images were removed; Chainguard publishes free, distroless builds.
  # Dev only: tracks "latest" for convenience, not suitable for production.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # Distroless image has no shell, so no wait loop: retry until MinIO accepts connections.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${R2_BUCKET}"]
    restart: on-failure

  # Product images are public in production (R2 behind a CDN), so the dev bucket allows anonymous GET too.
  minio-public:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["anonymous", "set", "download", "local/${R2_BUCKET}"]
    restart: on-failure

volumes:
  pgdata:
  miniodata:
