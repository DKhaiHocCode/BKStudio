# Production stack (T-042, ADR-0005): caddy -> frontend + backend -> postgres. Usage (from repo root):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# Production-like run on a dev machine (MinIO instead of R2, no emails): see infra/docker-compose.local-test.yml.
# Only caddy publishes ports. Never publish backend/frontend/postgres: Docker NAT makes outside traffic look like a
# trusted 172.x peer (docs/DEPLOYMENT.md section 2).
name: bkstudio

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

networks:
  internal:
    # Fixed subnet so TRUSTED_PROXIES can name exactly Caddy's address (not the whole 172.x range: frontend is there
    # too). IPv4 only. Change the subnet only if it collides with a host network, and update TRUSTED_PROXIES with it.
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come from .128-.255 only, so no other container can take Caddy's 172.30.0.10.
          ip_range: 172.30.0.128/25
  # Database traffic only (backend + postgres), no route outside: caddy and frontend cannot reach postgres.
  db:
    internal: true

services:
  caddy:
    <<: *hardening
    # caddy:2.11.9 multi-arch index, checked 2026-11-15.
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    # The caddy binary carries the cap_net_bind_service file capability; exec fails if it is not in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    # Bound to 0.0.0.0 only: an IPv6 listener would go through docker-proxy (userland proxy), which rewrites every
    # IPv6 client to the gateway address, so all IPv6 visitors would share one rate-limit bucket. Without AAAA DNS
    # records nobody connects over IPv6 anyway (docs/DEPLOYMENT.md section 3).
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
      - "0.0.0.0:${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (domain in prod, :80 locally)}
      CDN_ORIGIN: ${CDN_ORIGIN:?set CDN_ORIGIN (origin of R2_PUBLIC_BASE_URL)}
      BACKEND_UPSTREAM: backend:8080
      FRONTEND_UPSTREAM: frontend:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks:
      internal:
        ipv4_address: 172.30.0.10
    # Caddy's admin API listens on localhost:2019 inside the container only; it answers once the config is loaded.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 128m

  frontend:
    <<: *hardening
    image: bkstudio-frontend:${IMAGE_TAG:-local}
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL (public origin, e.g. https://shop.example)}
    environment:
      # Server-side catalog fetches (src/lib/catalog.ts); the browser reaches /api through Caddy.
      BACKEND_URL: http://backend:8080
    tmpfs:
      - /app/.next/cache:size=64m,uid=1000,gid=1000
      - /tmp
    networks: [internal]
    mem_limit: 512m

  backend:
    <<: *hardening
    image: bkstudio-backend:${IMAGE_TAG:-local}
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL (https://...)}
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT}
      R2_REGION: ${R2_REGION:-auto}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?set R2_PUBLIC_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      # Tied to the network above: trust X-Forwarded-For only from Caddy's fixed address.
      FORWARD_HEADERS_STRATEGY: native
      TRUSTED_PROXIES: 172.30.0.10/32
      SPRING_SERVLET_MULTIPART_LOCATION: /uploads
    tmpfs:
      # java.io.tmpdir: the extracted libwebp .so must be loadable (exec); Tomcat work dirs. Small on purpose.
      - /tmp:exec,nosuid,nodev,size=16m
      # Multipart upload temp files (max request 52 MB), noexec, only the app user. Counts toward mem_limit.
      - /uploads:size=128m,uid=10001,gid=10001,mode=0700
    networks: [internal, db]
    depends_on:
      postgres:
        condition: service_healthy
    # Tomcat (up to 200 request threads) + JVM/GC/scheduler threads would hit the default 256.
    pids_limit: 512
    # Heap = 50% (MaxRAMPercentage in the Dockerfile) = 640 MB; the rest is metaspace, threads, libwebp, tmpfs.
    # 4 GB VPS budget: caddy 128m + frontend 512m + backend 1280m + postgres 768m = 2688m, ~1.3 GB left for the OS.
    mem_limit: 1280m

  postgres:
    <<: *hardening
    # Digest of the postgres:16 tag on 2026-11-15 (PostgreSQL 16.16, Debian). Bump the digest deliberately.
    image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    # Runs as the image's postgres user from the start, so no root entrypoint (chown/gosu) and no capabilities needed.
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    shm_size: 128m
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
